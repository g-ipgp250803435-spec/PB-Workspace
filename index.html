<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="Pengurusan PB, kursus, dokumen dan peperiksaan IPG Kampus Kota Bharu dengan Google Drive.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PB Workspace">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <title>PB Workspace v3.2 — IPG Kampus Kota Bharu</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js" defer></script>
  <style>
    :root { --bg:#f6f7fb; --surface:#fff; --ink:#16233b; --muted:#788398; --line:#e9edf3; --blue:#275fe4; --blue-dark:#164abe; --blue-pale:#ebf1ff; --green:#087f71; --green-pale:#e5f6f1; --orange:#a66516; --orange-pale:#fff4e5; --red:#b4474c; --red-pale:#fceced; --shadow:0 10px 36px rgba(31,47,79,.045); --r:18px; }
    * { box-sizing:border-box; }
    html { -webkit-tap-highlight-color:transparent; }
    body { margin:0; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.48; }
    button,input,select,textarea {font:inherit;}
    button {cursor:pointer;}
    a {color:inherit;}
    :focus-visible { outline:3px solid #78a5fa; outline-offset:3px; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .app-shell { min-height:100dvh; }
    .sidebar { width:248px; position:fixed; inset:0 auto 0 0; background:#fff; border-right:1px solid var(--line); z-index:10; display:flex; flex-direction:column; padding:29px 17px 20px; }
    .brand {display:flex; align-items:center; gap:11px; padding:0 9px; margin-bottom:45px;}
    .brand-logo {width:38px; height:38px; flex:none; border-radius:12px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:800; letter-spacing:-1.4px; box-shadow:0 5px 15px #285fe52b; }
    .brand-title {font-size:15px; font-weight:800; letter-spacing:-.55px; line-height:1.25;}
    .brand-sub {font-size:11px;color:#929bad;letter-spacing:.16px; margin-top:3px;}
    .section-label {font-size:10px; color:#a1aab9; letter-spacing:1.5px; font-weight:800; margin:0 14px 12px;}
    .desktop-nav {display:flex; flex-direction:column; gap:5px;}
    .nav-btn {border:0; background:transparent; color:#778397; display:flex; align-items:center; gap:13px; width:100%; min-height:44px; border-radius:11px; padding:10px 13px; text-align:left; font-size:13px; font-weight:650; transition:background .2s,color .2s;}
    .nav-btn svg {width:18px;height:18px;stroke-width:1.9; flex:none;}
    .nav-btn:hover {background:#f5f7fc;color:#243755;}
    .nav-btn.active {background:#edf2ff;color:var(--blue);}
    .nav-count {margin-left:auto; background:#e9edf4; color:#65738b; font-size:10px; min-width:23px; padding:2px 6px; border-radius:20px; text-align:center;}
    .nav-btn.active .nav-count {background:#dbe6ff;color:#295ed1;}
    .sidebar-foot {margin-top:auto;}
    .sidebar-note {background:#f6f8fc; border:1px solid #edf0f6; border-radius:14px; padding:16px 14px; margin:14px 3px 14px;}
    .sidebar-note svg {width:19px;height:19px;color:#426ee5;}
    .sidebar-note strong {display:block;font-size:12px;margin:8px 0 4px;}
    .sidebar-note p {font-size:11px; color:var(--muted); margin:0;line-height:1.55;}
    .workspace {margin-left:248px; min-height:100vh; }
    .topbar {max-width:1300px; margin:auto; display:flex; align-items:center; justify-content:space-between; padding:27px 48px 8px; gap:15px; }
    .crumb {font-size:12px;font-weight:650;color:#9aa4b5;}
    .crumb strong {color:#5c6980;font-weight:650;}
    .top-actions {display:flex;gap:13px;align-items:center;}
    .top-date {font-size:11px;color:#8995a8;display:flex;gap:7px;align-items:center;}
    .top-date svg {width:15px;height:15px;}
    .icon-button {width:39px;height:39px;border:1px solid var(--line);background:#fff;border-radius:12px;display:inline-grid;place-items:center;color:#617088;}
    .icon-button svg {width:18px;height:18px;}
    .icon-button:hover {background:#eff3ff;color:var(--blue);}
    .main-content { max-width:1300px; margin:0 auto; padding:19px 48px 80px; }
    .page-head {display:flex;align-items:end;justify-content:space-between;gap:16px;margin:4px 0 26px;}
    .eyebrow {font-size:11px;font-weight:780;letter-spacing:1.65px;text-transform:uppercase;color:var(--blue); margin:0 0 8px; }
    h1 {font-size:clamp(27px,3vw,34px);letter-spacing:-1.45px;line-height:1.18; margin:0 0 8px; font-weight:790;}
    .subtitle {color:var(--muted);font-size:13px;margin:0;line-height:1.65;}
    h2 {font-size:17px;letter-spacing:-.55px;margin:0;font-weight:760;}
    h3 {margin:0;}
    .btn {display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:10px 15px;min-height:39px;font-size:12px;font-weight:750; white-space:nowrap;}
    .btn svg {width:16px;height:16px;stroke-width:2.1;}
    .btn-primary {background:var(--blue);color:#fff;box-shadow:0 4px 10px #275fe41b;}
    .btn-primary:hover {background:var(--blue-dark);}
    .btn-light {background:#fff;color:#42536e;border-color:#e8edf5;}
    .btn-light:hover {background:#f8faff;}
    .btn-quiet {background:transparent;color:#65738b;}
    .btn-danger {background:#fff1f1;color:#b4474c;}
    .btn-small {min-height:32px;padding:7px 11px;border-radius:9px;font-size:11px;}
    .dashboard-grid {display:grid;grid-template-columns:minmax(0,1.56fr) minmax(270px,.94fr);gap:17px;}
    .hero {position:relative;isolation:isolate;overflow:hidden; min-height:250px; background:#17294a; color:#fff; border-radius:21px; padding:29px 32px;display:flex;align-items:center;}
    .hero:before {content:"";position:absolute;z-index:-1;width:440px;height:440px;border-radius:50%;right:-190px;top:-210px;background:radial-gradient(circle,#476ec1a8 0%,#3761ab55 45%,transparent 68%);}
    .hero:after {content:"";position:absolute;z-index:-1;width:300px;height:300px;border:1px solid #ffffff1a;border-radius:50%;right:-90px;bottom:-160px;box-shadow:0 0 0 55px #ffffff05,0 0 0 107px #ffffff05;}
    .hero-tag {display:inline-flex;align-items:center;gap:7px; border:1px solid #ffffff2a;background:#ffffff11; border-radius:20px;padding:5px 10px;color:#d3e2ff;font-size:10px;font-weight:720;}
    .hero-tag .dot {width:6px;height:6px;border-radius:100%;background:#8cd8cd;}
    .hero h2 {font-size:clamp(24px,3vw,30px); line-height:1.22; letter-spacing:-1.15px;max-width:330px; margin:20px 0 10px;}
    .hero p {color:#b6c7e5;font-size:12px;max-width:345px;line-height:1.65;margin:0 0 21px;}
    .hero .btn {background:#fff;color:#1b345e; box-shadow:none;}
    .hero .btn:hover {background:#f0f4ff;}
    .hero-art {position:absolute;right:23px;bottom:13px;opacity:.16;font-size:114px;font-weight:800;letter-spacing:-12px;pointer-events:none;}
    .progress-card,.surface {background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}
    .progress-card {padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-height:250px;}
    .mini-header {display:flex;justify-content:space-between;align-items:center;gap:12px;}
    .mini-label {font-size:11px;font-weight:700;color:#5f6d80;}
    .tiny-label {font-size:10px;color:#9ca7b6;letter-spacing:.7px;text-transform:uppercase;font-weight:800;}
    .progress-body {display:flex;gap:20px;align-items:center;margin:16px 0 12px;}
    .ring {flex:none; width:126px;height:126px;border-radius:50%; display:grid;place-items:center; background:conic-gradient(var(--blue) calc(var(--pct)*1%), #edf1f7 0);}
    .ring-hole {width:101px;height:101px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;}
    .ring-hole strong {font-size:29px;line-height:1;letter-spacing:-1px;}
    .ring-hole span {font-size:10px;color:var(--muted);margin-top:7px;}
    .progress-detail {flex:1;min-width:0;}
    .progress-stat {display:flex;align-items:center;gap:8px;font-size:11px;color:#7d889b;margin:10px 0;}
    .legend-dot {width:8px;height:8px;border-radius:50%;background:#386beb;flex:none;}
    .legend-dot.green {background:#21ab91;}
    .progress-stat strong {margin-left:auto;color:var(--ink);font-size:13px;}
    .progress-foot {font-size:11px;color:#8c96a6;border-top:1px solid var(--line);padding-top:13px;}
    .stats-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0 30px;}
    .stat-card {background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px 20px;display:flex;justify-content:space-between;align-items:center;min-height:104px;}
    .stat-card span:first-child {font-size:11px;color:#8b96a8;font-weight:700;}
    .stat-card strong {display:block;font-size:27px;letter-spacing:-1px;margin-top:5px;font-weight:790;line-height:1.05;}
    .stat-icon {border-radius:13px;width:43px;height:43px;display:grid;place-items:center;background:#eff3ff;color:#3667df;}
    .stat-icon.green {background:#e9f7f2;color:#159178;}
    .stat-icon.orange {background:#fff3e5;color:#bc863d;}
    .stat-icon svg {width:20px;height:20px;}
    .section-heading {display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 15px;}
    .section-caption {font-size:11px;color:#9aa4b6;margin:4px 0 0;}
    .text-link {display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--blue);font-size:12px;font-weight:700;padding:7px 2px;}
    .text-link svg {height:15px;width:15px;}
    .split-content {display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,.95fr);gap:19px;align-items:start;}
    .list-surface {background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
    .task-row {padding:16px 17px; display:flex;align-items:center;gap:13px;border-bottom:1px solid #eff1f5;transition:background .15s;}
    .task-row:last-child {border-bottom:0;}
    .task-row:hover {background:#fbfcff;}
    .check-control {width:25px;height:25px;flex:none;border:1.7px solid #dce3ed;background:#fff;color:#fff;border-radius:8px;display:grid;place-items:center;padding:0;}
    .check-control:hover {border-color:var(--blue);background:#eef3ff;}
    .check-control.done {background:#15937c;border-color:#15937c;}
    .check-control.done:hover {background:#0d806d;}
    .check-control svg {width:15px;height:15px;}
    .task-copy {flex:1;min-width:0;}
    .task-title {display:block;font-size:12px;font-weight:750;line-height:1.5;color:#24304b;letter-spacing:-.08px;}
    .task-title.done {color:#7d8a9c;text-decoration:line-through; text-decoration-color:#bdc7d6;}
    .task-meta {display:flex;align-items:center;flex-wrap:wrap;gap:5px 9px;margin-top:5px;font-size:10px;color:#95a0af;}
    .task-meta b {font-weight:760;color:#61738e;}
    .task-right {flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
    .date-pill {display:inline-block;background:#f1f4f9;color:#62718b;padding:4px 8px;border-radius:7px;font-size:10px;font-weight:750;white-space:nowrap;}
    .date-pill.urgent {background:#fff0e2;color:#b16b22;}
    .date-pill.overdue {background:#ffebec;color:#ba4f53;}
    .date-pill.success {background:#e8f7f1;color:#13836f;}
    .task-day {font-size:10px;color:#9aa4b3;}
    .row-more {background:transparent;border:0;padding:6px;color:#93a1b4;border-radius:8px;margin:-5px -9px -5px 0;}
    .row-more:hover {color:var(--blue);background:#f0f4ff;}
    .row-more svg {width:17px;height:17px;}
    .course-mini {background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;}
    .course-mini-row {margin:17px 0 0;}
    .course-mini-top {display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px;font-size:11px;}
    .course-mini-top b {font-weight:750;color:#5c6d83;}
    .course-mini-top span {color:#97a2b2;}
    .bar {height:6px;border-radius:50px;background:#edf1f7;overflow:hidden;}
    .bar > span {display:block;height:100%;background:#386be9;border-radius:50px;transition:width .2s;}
    .filter-row {display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:15px 0 16px;}
    .segmented {display:flex;gap:4px;padding:4px;border-radius:12px;background:#eaedf4;width:max-content;max-width:100%;}
    .segmented button {border:0;background:transparent;color:#808b9e;border-radius:9px;padding:8px 13px;font-size:11px;font-weight:750;white-space:nowrap;}
    .segmented button.active {background:#fff;color:var(--blue);box-shadow:0 2px 8px #1e315410;}
    .search {min-height:39px;width:240px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;color:#a3aab6;}
    .search svg {height:17px;width:17px;flex:none;}
    .search input {min-width:0;border:0;outline:0;flex:1;width:100%;color:var(--ink);font-size:12px;background:transparent;}
    .search input::placeholder {color:#a4afbd;}
    .course-select {max-width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;color:#4c5d76;padding:9px 12px;font-size:11px;font-weight:700;min-height:39px;}
    .task-list-header {font-size:11px;font-weight:750;color:#9ba6b6;letter-spacing:.5px;text-transform:uppercase;margin:20px 0 10px;}
    .task-list-header:first-child {margin-top:2px;}
    .task-full {border:1px solid var(--line);border-radius:15px;background:#fff;margin-bottom:9px;}
    .task-full .task-row {border:0;border-radius:15px;padding:16px 18px;}
    .task-full .task-title {font-size:13px;}
    .task-extra {padding:0 18px 15px 56px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .tiny-chip {padding:4px 8px;background:#f4f6f9;border-radius:6px;color:#7c879a;font-size:10px;}
    .note-chip {max-width:100%;white-space:normal;}
    .course-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;}
    .course-card {background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px;transition:transform .2s,box-shadow .2s;}
    .course-card:hover {transform:translateY(-2px);box-shadow:0 12px 24px #192b4a09;}
    .course-card-top {display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px;}
    .course-symbol {width:41px;height:41px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:800;font-size:13px;letter-spacing:-.4px;}
    .course-card-name {font-size:14px;line-height:1.48;min-height:42px;font-weight:750;letter-spacing:-.15px;margin:0 0 8px;}
    .course-card-code {font-size:11px;color:#8490a3;margin-bottom:18px;}
    .course-bottom {display:flex;justify-content:space-between;font-size:11px;align-items:center;gap:8px;color:#8c99a9;margin-bottom:9px;}
    .course-bottom strong {color:#546780;}
    .course-card .bar > span {background:var(--accent);}
    .course-card-foot {margin-top:18px;border-top:1px solid #eff1f5;padding-top:13px;display:flex;justify-content:space-between;align-items:center;}
    .course-card-foot span {font-size:10px;color:#9aa5b5;}
    .course-card-foot button {border:0;background:none;color:var(--blue);font-size:11px;font-weight:740;display:flex;gap:5px;align-items:center;}
    .course-card-foot button svg {width:14px;height:14px;}
    .exam-card {background:white;border:1px solid var(--line);border-radius:15px;padding:19px;display:flex;align-items:center;gap:15px;margin-bottom:11px;}
    .exam-icon {width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#f0f3ff;color:#486fdf;flex:none;}
    .exam-icon svg {width:21px;height:21px;}
    .exam-copy {flex:1;min-width:0;}
    .exam-copy strong {display:block;font-size:12px;line-height:1.55;margin-bottom:4px;}
    .exam-copy small {color:#8b96a7;font-size:11px;}
    .exam-right {display:flex;gap:9px;align-items:center;}
    .status {display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 9px;font-size:10px;font-weight:720;white-space:nowrap;background:#f3f5fa;color:#66758e;}
    .status:before {content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
    .status.done {background:#e8f7f1;color:#12856f;}
    .status.pending {background:#fff3e5;color:#a46c26;}
    .status.overdue {background:#fdebeb;color:#bd5155;}
    .empty {border:1px dashed #dfe5ef;background:#fff;border-radius:16px;padding:47px 18px;text-align:center;color:#98a3b3;}
    .empty-icon {width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#f2f5fc;color:#5b7dd6;margin:0 auto 13px;}
    .empty-icon svg {width:25px;height:25px;}
    .empty h3 {font-size:13px;color:#43536c; margin-bottom:5px;}
    .empty p {font-size:11px;margin:0;}
    .calendar-grid-wrap {background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;}
    .calendar-controls {display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px;}
    .calendar-controls strong {font-size:16px;}
    .calendar-actions {display:flex;align-items:center;gap:7px;}
    .calendar-actions .icon-button {width:33px;height:33px;border-radius:9px;}
    .calendar-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
    .weekday {font-size:10px;text-align:center;color:#9ca6b5;font-weight:780;padding:10px 0;}
    .calendar-day {height:70px;background:#fbfcfe;border:1px solid transparent;border-radius:10px;text-align:left;padding:8px;position:relative;color:#586880;}
    .calendar-day.outside {background:#fff;color:#c9d0da;}
    .calendar-day.today {border-color:#bad0ff;}
    .calendar-day.selected {background:#eaf0ff;border-color:#7aa0ef;color:#2052ba;}
    .calendar-day:hover {background:#edf3ff;}
    .calendar-day strong {font-weight:680;font-size:11px;}
    .calendar-day.today strong {background:#275fe4;color:white;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin:-4px;}
    .cal-dots {position:absolute;bottom:10px;left:9px;display:flex;gap:3px;}
    .cal-dots span {background:#3067e9;width:5px;height:5px;border-radius:50%;}
    .cal-dots span.done {background:#22a58a;}
    .cal-dots span.exam {background:#c38b36;}
    .calendar-layout {display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.85fr);gap:17px;align-items:start;}
    .date-panel {background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-height:225px;}
    .date-panel h3 {font-size:15px;margin-bottom:3px;letter-spacing:-.2px;}
    .date-panel-sub {font-size:10px;color:#9ca8b7;margin-bottom:17px;}
    .date-entry {border-top:1px solid #eff1f5;padding:14px 0;}
    .date-entry b {display:block;font-size:12px;margin-bottom:6px;}
    .date-entry p {font-size:10px;color:#8f9bae;margin:0;}
    .date-entry .status {margin-top:8px;}
    .hint-box {display:flex;gap:13px;background:#edf3ff;border:1px solid #e0eaff;color:#45628b;padding:15px 18px;border-radius:13px;font-size:11px;line-height:1.6;margin:18px 0 0;}
    .hint-box svg {color:var(--blue);width:18px;height:18px;flex:none;}
    .fab {display:none;}
    .mobile-nav {display:none;}
    .modal-root:empty {display:none;}
    .modal-root {position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
    .modal-backdrop {position:absolute;inset:0;background:#10203f88;backdrop-filter:blur(3px);}
    .modal-panel {position:relative;width:100%;max-width:540px;max-height:min(89dvh,850px);overflow:auto;background:#fff;border-radius:20px;box-shadow:0 25px 80px #0e1b3460;padding:25px;}
    .modal-head {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;}
    .modal-head h2 {font-size:19px;}
    .field {display:flex;flex-direction:column;gap:7px;margin-bottom:15px;min-width:0;}
    .field label {font-size:11px;color:#52617a;font-weight:750;}
    .field input,.field select,.field textarea {width:100%;background:#fff;color:#253650;border:1px solid #e1e7f0;border-radius:10px;padding:10px 12px;min-height:41px;outline:0;font-size:12px;}
    .field textarea {resize:vertical;min-height:82px;}
    .field input:focus,.field select:focus,.field textarea:focus {border-color:#7399f1;box-shadow:0 0 0 3px #e8eeff;}
    .field-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}

    .two-status-inputs svg{width:16px;height:16px;color:var(--blue)}

    .task-full .task-title.done{text-decoration:none!important;color:var(--ink)!important}
    .cal-dots span.submitted{background:#5475e2}
    :root[data-theme="dark"] .two-status-inputs label{background:#1a2a40;border-color:var(--line)}
    @media(max-width:400px){.two-status-inputs{grid-template-columns:1fr}.task-actions{margin-left:0}}

    .rt-status-button{display:inline-flex;align-items:center;gap:7px;min-height:37px;padding:7px 11px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:var(--surface);font-size:11px;font-weight:730;white-space:nowrap}
    .rt-status-button svg{height:16px;width:16px;color:var(--blue)}
    .rt-indicator{color:var(--muted)}.rt-indicator.connected{color:var(--green)}.rt-indicator.warn{color:var(--red)}
    .rt-input{font-size:11px;padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);width:240px;max-width:100%;min-width:100px}
    :root[data-theme="dark"] .rt-status-button{border-color:var(--line)}
    @media(max-width:1080px){.rt-status-button{max-width:155px}.rt-indicator{overflow:hidden;text-overflow:ellipsis}}
    @media(max-width:640px){.rt-status-button{padding:7px 9px;min-height:38px}.rt-indicator{display:none}.rt-status-button svg{width:18px;height:18px}}
    .doc-toolbar{flex-wrap:wrap}
    @media (prefers-reduced-motion:reduce) {*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important;}}

  function translateText(text){if(preferences.language!=='en')return text;
    const trimmed=text.trim();if(!trimmed)return text;
    let result=EN_TRANSLATIONS[trimmed];
    if(result===undefined){result=trimmed
      .replace(/(\d+) hari lagi/g,'$1 days left').replace(/Lewat (\d+) hari/g,'$1 days overdue')
      .replace(/(\d+) kursus didaftarkan/g,'$1 registered courses')
      .replace(/(\d+) belum selesai/g,'$1 pending').replace(/(\d+) sudah diselesaikan/g,'$1 completed')
      .replace(/(\d+) aktiviti pada tarikh ini/g,'$1 activities on this date')
      .replace(/(\d+) daripada (\d+) selesai/g,'$1 of $2 completed')
      .replace(/(\d+) pentaksiran berterusan/g,'$1 assessments')
      .replace(/(\d+) tugasan menanti perhatian anda\./g,'$1 assignments need your attention.')
      .replace(/(\d+) tugasan/g,'$1 tasks')
      .replace(/(\d+) fail/g,'$1 files').replace(/(\d+)\/(\d+) selesai/g,'$1/$2 completed')
      .replace(/\bbelum selesai\b/g,'pending').replace(/\bselesai\b/g,'completed')
      .replace(/\bTarikh belum diumumkan\b/g,'Date not announced')
      .replace(/\bLihat semua\b/g,'View all')
      .replace(/\bPeperiksaan akhir\b/g,'Final exam')
      .replace(/\bTiada tarikh\b/g,'No date')
      .replace(/^Padam /,'Delete ').replace(/^Buka /,'Open ').replace(/^Muat turun /,'Download ');
      if(result===trimmed){for(const [ms,en] of Object.entries(EN_TRANSLATIONS).sort((a,b)=>b[0].length-a[0].length)){
        if(ms.length>=8&&result.includes(ms)){result=result.split(ms).join(en);}
      }}
    }
    return text.replace(trimmed,result);
  }

    for(const node of nodes){if(node.parentElement?.closest('.course-card-name,.task-title,.exam-copy strong,.doc-file-content strong,.date-entry b,.note-chip,.doc-course-head h2,.user-greeting,.profile-name'))continue;node.nodeValue=translateText(node.nodeValue);}

  }

  function empty(title,sub) {return `<div class="empty"><div class="empty-icon">${svg('check-circle')}</div><h3>${e(title)}</h3><p>${e(sub)}</p></div>`;}

  // Documents are temporarily cached in IndexedDB for safe previews and transfers.
  const DOCUMENT_DB='pb-workspace-documents-v2', MAX_FILE_BYTES=25*1024*1024;
  let docDB=null,documents=[],docsStatus='loading';
  const docDate = iso => iso&&!Number.isNaN(new Date(iso).getTime())?new Intl.DateTimeFormat(language(),{day:'numeric',month:'short',year:'numeric'}).format(new Date(iso)):'—';
  function readableSize(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB';}
  function docCategory(kind){return kind==='courseinfo'?'Maklumat Kursus':'Pentaksiran Berterusan';}
  function docDatabase(){if(docDB)return Promise.resolve(docDB);if(!('indexedDB' in window))return Promise.reject(new Error('IndexedDB unavailable'));
    return new Promise((resolve,reject)=>{const req=indexedDB.open(DOCUMENT_DB,1);
      req.onupgradeneeded=()=>{const db=req.result;db.createObjectStore('metadata',{keyPath:'id'});db.createObjectStore('files',{keyPath:'id'});};
      req.onsuccess=()=>{docDB=req.result;docDB.onversionchange=()=>{docDB.close();docDB=null;};resolve(docDB);};
      req.onerror=()=>reject(req.error||new Error('Cannot open document storage'));
      req.onblocked=()=>reject(new Error('Database in use in another tab'));
    });
  }
  async function docRequest(store,mode,action){const db=await docDatabase();return new Promise((resolve,reject)=>{
    let req;const tx=db.transaction(store,mode);const object=tx.objectStore(store);
    try{req=action(object);}catch(err){tx.abort();return reject(err);}
    let result;req.onsuccess=()=>result=req.result;tx.oncomplete=()=>resolve(result);
    tx.onerror=()=>reject(tx.error||new Error('Document storage error'));tx.onabort=()=>reject(tx.error||new Error('Document storage canceled'));
  });}
  async function loadDocuments(){try{documents=(await docRequest('metadata','readonly',store=>store.getAll())).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));docsStatus='ready';}catch(err){console.warn(err);docsStatus='error';}render();}
  async function getStoredFile(id){const record=await docRequest('files','readonly',s=>s.get(id));if(!record||!record.blob)throw new Error('File missing');return record.blob;}
  async function addStoredDocuments(files,course,category,notes){const db=await docDatabase();const now=new Date().toISOString();const metas=[];
    await new Promise((resolve,reject)=>{const tx=db.transaction(['metadata','files'],'readwrite');const meta=tx.objectStore('metadata'),bin=tx.objectStore('files');
      for(const file of files){const id=newId('d');const row={id,course,category,name:file.name,size:file.size,mime:file.type||'application/octet-stream',notes,createdAt:now};
        meta.put(row);bin.put({id,blob:file});metas.push(row);}
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Storage quota exceeded'));tx.onabort=()=>reject(tx.error||new Error('Storage quota exceeded'));
    });documents.unshift(...metas);documents.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  }
  async function removeStoredDocument(id){const db=await docDatabase();await new Promise((resolve,reject)=>{
    const tx=db.transaction(['metadata','files'],'readwrite');tx.objectStore('metadata').delete(id);tx.objectStore('files').delete(id);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
  });documents=documents.filter(x=>x.id!==id);}
  async function updateCourseDocuments(oldCode,newCode){if(oldCode===newCode)return;const targets=documents.filter(x=>x.course===oldCode);if(!targets.length)return;
    const db=await docDatabase();await new Promise((resolve,reject)=>{const tx=db.transaction('metadata','readwrite');for(const m of targets)tx.objectStore('metadata').put({...m,course:newCode});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});
    targets.forEach(x=>x.course=newCode);
  }
  async function clearDocuments(ids=null){if(docsStatus!=='ready'){
      if(ids===null||documents.some(x=>ids.includes(x.course)))throw new Error('Document storage is not ready');return;
    }
    const deleting=ids===null?documents:documents.filter(x=>ids.includes(x.course));const db=await docDatabase();
    await new Promise((resolve,reject)=>{const tx=db.transaction(['metadata','files'],'readwrite');
      if(ids===null){tx.objectStore('metadata').clear();tx.objectStore('files').clear();}
      else for(const row of deleting){tx.objectStore('metadata').delete(row.id);tx.objectStore('files').delete(row.id);}
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
    });documents=ids===null?[]:documents.filter(x=>!ids.includes(x.course));
  }
  function documentsOf(course,category){return documents.filter(x=>x.course===course&&x.category===category);}
  function docsUploadButton(course='',category=''){return `<button class="btn btn-light btn-small" data-action="add-document" ${course?`data-course="${e(course)}"`:''} ${category?`data-category="${e(category)}"`:''}>${svg('plus')} <span>Tambah dokumen</span></button>`;}
  function fileCard(d){return `<div class="doc-item"><div class="doc-file-icon">${svg('file-text')}</div><div class="doc-file-content"><strong>${e(d.name)}</strong><p>${readableSize(d.size)} · ${e(docDate(d.createdAt))}${d.notes?` · ${e(d.notes)}`:''}</p></div><div class="doc-actions"><button data-action="open-document" data-id="${e(d.id)}" title="Buka" aria-label="Buka ${e(d.name)}">${svg('eye')}</button><button data-action="download-document" data-id="${e(d.id)}" title="Muat turun" aria-label="Muat turun ${e(d.name)}">${svg('download')}</button><button class="danger" data-action="delete-document" data-id="${e(d.id)}" title="Padam" aria-label="Padam ${e(d.name)}">${svg('trash')}</button></div></div>`;}
  function renderDocsBucket(c,category){const ds=documentsOf(c.id,category);return `<div class="doc-section"><div class="doc-section-head"><b>${docCategory(category)} <span style="font-size:10px;color:var(--muted)">· ${ds.length}</span></b>${docsUploadButton(c.id,category)}</div>${ds.length?ds.map(fileCard).join(''):`<div class="doc-empty">Tiada fail dimuat naik</div>`}</div>`;}
  function renderDocuments(){const activeCourses=state.docCourse==='all'?data.courses:data.courses.filter(c=>c.id===state.docCourse),courseCount=new Set(documents.map(d=>d.course)).size;
    return `${heading('Pustaka dokumen.','Simpan fail PB dan Maklumat Kursus mengikut kursus dan segerakkan melalui Google Drive.')}
      ${docsStatus==='error'?`<div class="storage-warning">${svg('alert-circle')} Storan dokumen tidak tersedia pada pelayar ini. Cuba buka aplikasi melalui HTTPS atau pelayar lain.</div>`:''}
      <div class="doc-stat-row"><div class="doc-stat"><span>Jumlah dokumen</span><strong>${documents.length}</strong></div><div class="doc-stat"><span>Kursus berfail</span><strong>${courseCount}</strong></div><div class="doc-stat"><span>Jenis dokumen</span><strong>2</strong></div></div>
      <div class="doc-toolbar"><div class="section-heading" style="margin:0"><div><h2>Dokumen kursus</h2><p class="section-caption">${data.courses.length} kursus didaftarkan</p></div></div><select id="documents-course-filter" class="course-select" aria-label="Pilih kursus"><option value="all">Semua kursus</option>${data.courses.map(c=>`<option value="${e(c.id)}" ${state.docCourse===c.id?'selected':''}>${e(c.id)} — ${e(c.name)}</option>`).join('')}</select><button class="btn btn-light btn-small" data-action="cloud-settings">${svg('globe')} Google Drive</button><button class="btn btn-light btn-small" data-action="drive-doc-download">${svg('download')} ${preferences.language==='en'?'Get files':'Ambil fail'}</button><button class="btn btn-light btn-small" data-action="drive-doc-upload">${svg('upload')} ${preferences.language==='en'?'Upload files':'Hantar fail'}</button><button class="btn btn-primary btn-small" data-action="add-document" ${docsStatus==='ready'?'':'disabled'}>${svg('plus')} Tambah dokumen</button></div>
      <div class="doc-courses">${activeCourses.map(c=>{const num=documents.filter(d=>d.course===c.id).length;return `<section class="doc-course" style="--accent:${e(c.color)};--soft:${e(c.soft)}"><div class="doc-course-head"><div class="course-symbol">${e(c.id)}</div><div style="min-width:0"><div class="doc-code">${e(c.id)}</div><h2>${e(c.name)}</h2></div><span class="doc-count">${num} fail</span></div>${renderDocsBucket(c,'pb')}${renderDocsBucket(c,'courseinfo')}</section>`;}).join('')}</div>

      <div class="hint-box">${svg('shield-check')}<span>Fail PB dan MK dikendalikan melalui Google Drive sahaja. Semua tugasan, kursus dan peperiksaan disegerakkan automatik melalui Rekod Langsung selepas akaun disambungkan.</span></div>`;
  }

  async function downloadOrOpenDoc(id,preview){const d=documents.find(x=>x.id===id);if(!d)return toast('Dokumen tidak ditemui.');
    let win=null;const canPreview=/^(application\/pdf|image\/|text\/plain)/.test(d.mime)||/\.(pdf|png|jpe?g|webp|txt)$/i.test(d.name);
    if(preview&&canPreview){win=window.open('about:blank','_blank');if(win){win.document.title='PB Workspace';win.document.body.textContent='Opening document…';}}
    try{const blob=await getStoredFile(id);
      const ext=d.name.split('.').pop().toLowerCase();
      const safeMime=ext==='pdf'?'application/pdf':ext==='png'?'image/png':ext==='jpg'||ext==='jpeg'?'image/jpeg':ext==='webp'?'image/webp':ext==='txt'?'text/plain':'application/octet-stream';
      const displayBlob=win?new Blob([blob],{type:safeMime}):blob;
      const url=URL.createObjectURL(displayBlob);
      if(win){win.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),180000);return;}
      const a=document.createElement('a');a.href=url;a.download=d.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
      if(preview&&!canPreview)toast('Fail tidak boleh dipratonton di pelayar ini. Sila muat turun.');
    }catch(err){if(win)win.close();toast('Gagal buka fail: '+err.message);}
  }
  function blobAsBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob);});}
  function blobFromBase64(raw,mime){const binary=atob(raw);const parts=[];for(let i=0;i<binary.length;i+=65536){const slice=binary.slice(i,i+65536),buf=new Uint8Array(slice.length);for(let j=0;j<slice.length;j++)buf[j]=slice.charCodeAt(j);parts.push(buf);}return new Blob(parts,{type:mime||'application/octet-stream'});}
  async function replaceAllDocuments(items){const db=await docDatabase();const parsed=[];for(const item of items){if(!item||typeof item.name!=='string'||typeof item.course!=='string'||!['pb','courseinfo'].includes(item.category)||typeof item.base64!=='string'||item.base64.length>MAX_FILE_BYTES*1.37+100||!/^[a-zA-Z0-9+/]*={0,2}$/.test(item.base64))throw new Error('Invalid document in backup');const blob=blobFromBase64(item.base64,item.mime);if(blob.size>MAX_FILE_BYTES)throw new Error('File too large in backup');const meta={id:item.id||newId('d'),course:item.course,category:item.category,name:item.name,size:blob.size,mime:item.mime,notes:item.notes||'',createdAt:item.createdAt&&!Number.isNaN(new Date(item.createdAt).getTime())?item.createdAt:new Date().toISOString()};parsed.push({meta,blob});}
    await new Promise((resolve,reject)=>{const tx=db.transaction(['metadata','files'],'readwrite'),ms=tx.objectStore('metadata'),fs=tx.objectStore('files');ms.clear();fs.clear();for(const {meta,blob} of parsed){ms.put(meta);fs.put({id:meta.id,blob});}tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);});
    documents=parsed.map(x=>x.meta).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));docsStatus='ready';
  }

  async function realtimeFlush(){

  async function realtimeResolve(choice){

  function cloudAuthorize(){

    if(!window.google?.accounts?.oauth2?.initTokenClient)return toast('Google sign-in is not loaded. Retry.');

      const client=google.accounts.oauth2.initTokenClient({client_id:cloudConfig.clientId,scope:DRIVE_SCOPE,callback:async response=>{
        if(response.error||!response.access_token)return toast('Google authorization failed: '+(response.error||'No access token'));
        if(!String(response.scope||'').split(' ').includes(DRIVE_SCOPE))return toast('Google Drive scope not authorized.');
        cloudToken=response.access_token;cloudTokenExpiresAt=Date.now()+Number(response.expires_in||3000)*1000;

          if(cloudConfig.accountId&&cloudConfig.accountId!==accountId)cloudConfig.folderId='';

  async function driveFetch(url,{method='GET',headers={},body}={}){
    if(!navigator.onLine)throw Error('Internet connection required.');
    if(!cloudReady())throw Error('Connect Google Drive again to renew access.');
    const parsed=new URL(url);
    if(parsed.protocol!=='https:'||parsed.hostname!=='www.googleapis.com')throw Error('Unexpected Google Drive URL.');
    let res;try{res=await fetch(url,{method,headers:{Authorization:'Bearer '+cloudToken,...headers},body});}
    catch(_err){throw Error('Unable to reach Google Drive.');}
    if(!res.ok){let msg='';try{msg=(await res.json())?.error?.message||'';}catch(_err){}if(res.status===401)cloudTokenExpiresAt=0;throw Error('Drive '+res.status+': '+(msg||res.statusText));}
    return res;
  }
  async function driveJSON(url,opts){return (await driveFetch(url,opts)).json();}
  async function driveList(q,fields='nextPageToken,files(id,name,version,modifiedTime,mimeType,size,appProperties)'){
    const all=[];let page='';do{
      const params=new URLSearchParams({spaces:'drive',pageSize:'1000',fields,q});if(page)params.set('pageToken',page);
      const result=await driveJSON(DRIVE_API+'/files?'+params.toString());
      all.push(...(result.files||[]));page=result.nextPageToken||'';

  }
  async function driveFolder(create){

    if(found.length){cloudConfig.folderId=found[0].id;cloudPersist();return found[0].id;}
    if(!create)return null;
    const row=await driveJSON(DRIVE_API+'/files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'PB Workspace',mimeType:'application/vnd.google-apps.folder',appProperties:{pbWorkspace:'root-v3'}})});

  }
  async function driveCourseFolder(parentId,code){

    if(found.length)return found[0].id;
    const row=await driveJSON(DRIVE_API+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:String(code),mimeType:'application/vnd.google-apps.folder',parents:[parentId]})});
    return row.id;
  }
  async function driveUploadNew(blob,metadata){
    const mime=blob.type||'application/octet-stream';
    if(blob.size<=5*1024*1024){
      const boundary='pb_'+newId('b');const body=new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify(metadata),`\r\n--${boundary}\r\nContent-Type: ${mime}\r\n\r\n`,blob,`\r\n--${boundary}--\r\n`]);
      return driveJSON(DRIVE_UPLOAD+'/files?uploadType=multipart&fields=id,name,version',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
    }
    const res=await driveFetch(DRIVE_UPLOAD+'/files?uploadType=resumable&fields=id,name',{method:'POST',headers:{'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':mime},body:JSON.stringify(metadata)});
    const location=res.headers.get('Location');if(!location)throw Error('Drive upload session missing');

  }

  async function driveDocsDownload(){

          const props=file.appProperties||{},id=props.pbDocId,category=props.pbCategory;

  document.addEventListener('input',event=>{if(event.target.matches('[data-search]')){state.search=event.target.value;const el=document.getElementById('task-list-results');if(el){el.innerHTML=renderTaskResults();localizeRoot(el);}}});
  document.addEventListener('change',event=>{if(event.target.id==='course-filter'){state.course=event.target.value;render();}else if(event.target.id==='documents-course-filter'){state.docCourse=event.target.value;render();}});
  document.getElementById('import-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;
    try{if(file.size>180*1024*1024)throw new Error('Fail sandaran terlalu besar (180 MB).');const obj=JSON.parse(await file.text());if(!validateImported(obj))throw new Error('Format sandaran tidak sah.');if(obj.files!==undefined&&(!Array.isArray(obj.files)||obj.files.length>500))throw new Error('Senarai dokumen tidak sah.');
      if(window.confirm(preferences.language==='en'?'Import will replace all existing tasks, courses, exams and uploaded documents. Continue?':'Import akan menggantikan semua tugasan, kursus, peperiksaan dan fail dokumen sedia ada. Teruskan?')){
        if(docsStatus!=='ready')throw new Error('Storan dokumen tidak tersedia.');await replaceAllDocuments(obj.files||[]);
        data=normalizeData({version:4,courses:obj.courses,tasks:obj.tasks,exams:obj.exams,profile:obj.profile});save();closeModal();state.docCourse='all';state.course='all';navigate('dashboard');toast(preferences.language==='en'?'Backup imported.':'Sandaran berjaya diimport.');
      }
    }catch(err){toast('Gagal import: '+err.message);}event.target.value='';});

  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal)closeModal();});
  render();loadDocuments();
  window.addEventListener('load',()=>realtimeBoot());
  // v3.2 website updates: retire the previous PWA cache so updates aren't hidden behind old HTML.
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    window.addEventListener('load',()=>navigator.serviceWorker.getRegistrations().then(list=>Promise.all(list.filter(r=>r.scope.startsWith(location.origin+location.pathname.replace(/[^/]*$/,''))).map(r=>r.unregister()))).catch(()=>{}));
  }
  if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('pb-workspace-offline-')).map(k=>caches.delete(k)))).catch(()=>{});}
})();
</script>
</body>
</html>
